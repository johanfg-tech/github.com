<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas en Pareja</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1f6f5c;--brand-ink:#fff;--base-bg:#f6f5f1;--bg:color-mix(in srgb,var(--brand) 6%,var(--base-bg));--card:#fff;--ink:#1c2220;--muted:#69716d;--line:color-mix(in srgb,var(--brand) 9%,#e4e1d9);--soft:color-mix(in srgb,var(--brand) 7%,#f0eee8);--brand-soft:color-mix(in srgb,var(--brand) 13%,#fff);--int:#e0893b;--int-soft:#fbeadb;--danger:#c8473b;--warn:#d99a1e;--ok:#2f9e6e;--ins:#a7aeaa;--shadow:0 1px 2px rgba(20,30,25,.04),0 6px 20px rgba(20,30,25,.06);--r:18px}
:root[data-mode=dark]{--base-bg:#0e1110;--bg:color-mix(in srgb,var(--brand) 8%,var(--base-bg));--card:color-mix(in srgb,var(--brand) 6%,#171b1a);--ink:#eef1ef;--muted:#9ca4a1;--line:color-mix(in srgb,var(--brand) 12%,#2a302e);--soft:color-mix(in srgb,var(--brand) 9%,#1f2422);--brand-soft:color-mix(in srgb,var(--brand) 20%,#171b1a);--int:#f0a35e;--int-soft:#3a2b1d;--danger:#ef6b5e;--warn:#f1bd4a;--ok:#4fc28c;--ins:#6f7874;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:100px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{max-width:1080px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;margin-right:auto}
.logo i{width:32px;height:32px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:16px}
.monthpick{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 10px;font-weight:600}
.syncb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.syncb .dot{width:8px;height:8px;border-radius:50%;background:var(--ins)}
.syncb.ok .dot{background:var(--ok)}.syncb.err .dot{background:var(--danger)}.syncb.busy .dot{background:var(--warn)}
nav{max-width:1080px;margin:0 auto;padding:6px 12px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:16px}
h2{font-size:22px;letter-spacing:-.02em;margin:0}
h3{font-size:15px;margin:0;font-weight:700}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.grid{display:grid;gap:14px;margin-bottom:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid>.card{margin-bottom:0}
.grid>*{min-width:0}
html,body{overflow-x:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.ok .v{color:var(--ok)}.kpi.brand .v{color:var(--brand)}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--danger)}.brand{color:var(--brand)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.split>div{display:flex;flex-direction:column;gap:2px}
.split>div{min-width:0}.split .tiny{line-height:1.3}
.split b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar.lg{height:14px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));transition:width .4s}
.bar.warn>span{background:var(--warn)}.bar.over>span{background:var(--danger)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0}
.stack span{height:100%}
.s-cap{background:var(--brand)}.s-int{background:var(--int)}.s-ins{background:var(--ins)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.brow{padding:8px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bhead span:first-child{font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.link{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:13.5px}
.fab{position:fixed;right:20px;bottom:22px;z-index:30;width:60px;height:60px;border-radius:20px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 10px 26px rgba(31,111,92,.35);cursor:pointer}
.txl{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--soft)}
.ti{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.tm{flex:1;min-width:0;display:flex;flex-direction:column}
.tm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dgroup{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.danger{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.int{background:var(--int-soft);color:var(--int)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 10px;font-size:14px}
.filters input{flex:1;min-width:140px}
.inl{border:1px solid transparent;background:var(--soft);border-radius:9px;padding:5px 8px;width:120px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.inl:focus{outline:none;border-color:var(--brand);background:var(--card)}
.inl.date{width:140px;text-align:left;font-weight:500}
.subrow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.subrow:last-child{border-bottom:0}
.subrow.off{opacity:.5}
.subname{border:0;background:none;text-align:left;cursor:pointer;padding:0;min-width:0}
.subname b{display:block;font-weight:600}
@media (max-width:640px){.subrow{grid-template-columns:1fr auto;row-gap:6px}.subrow .inl{width:100%}.subrow .inl.date{width:100%}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .b{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:var(--brand)}
.chart .b.start{background:color-mix(in srgb,var(--brand) 30%,transparent)}
.chart .cv{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.chart .cl{font-size:11px;color:var(--muted);white-space:nowrap}
.insight{background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.insight.int{background:var(--int-soft)}
.sim{background:var(--soft);border-radius:14px;padding:14px;margin-top:12px}
.sim input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;width:150px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.simres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.simres>div{background:var(--card);border-radius:12px;padding:10px 12px}
.simres b{display:block;font-size:17px}
@media (max-width:560px){.simres{grid-template-columns:1fr}}
.goal .ring{display:flex;justify-content:space-between;align-items:baseline}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,15,13,.45)}
.mform{padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:90vh}
.mform h3{font-size:18px}
.mform label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.mform input,.mform select,.mform textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);font-weight:500;width:100%}
.mform input:focus,.mform select:focus,.mform textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.mform label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.mform label.check input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.mactions .del{margin-right:auto}
.irow{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.irow input{padding:8px 9px;font-size:14px}
.irow .full{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:220px;white-space:pre}
ol.steps{padding-left:20px;margin:8px 0;font-size:14px}
ol.steps li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.bnav{display:none}
.qamount{font-size:34px!important;font-weight:800!important;text-align:center;letter-spacing:-.02em}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer;min-height:64px;line-height:1.15;text-align:center}
.catgrid button span{font-size:22px}
.catgrid button.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.raw{font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;word-break:break-word}
.morelist{display:flex;flex-direction:column;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-weight:600;text-align:left;cursor:pointer}
.morelist button span{font-size:22px}
.pend{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--int-soft);margin-bottom:8px;border:0;width:100%;text-align:left;cursor:pointer}
.pend:last-child{margin-bottom:0}
@media (max-width:760px){
  header nav#nav{display:none}
  .top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  .logo{font-size:16px}
  .monthpick{padding:6px 6px;font-size:13px;width:132px}
  .logo i{width:28px;height:28px}
  .syncb{padding:6px 8px;font-size:12px}
  #synct{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;cursor:pointer}
  .bnav button span{font-size:20px;line-height:1;filter:grayscale(1);opacity:.75}
  .bnav button.on{color:var(--brand)}
  .bnav button.on span{filter:none;opacity:1}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom));right:16px;width:58px;height:58px}
  body{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh}
  .mform{padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh}
  .mform input,.mform select{font-size:16px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  main{padding:12px}
  .card{padding:14px}
  .big{font-size:27px}
  .kpi .v{font-size:18px}
  h2{font-size:20px}
}
/* ---------- temas y efectos ---------- */
body,.card,header,.bnav,dialog{transition:background-color .45s ease,border-color .45s ease,color .3s ease}
.btn,.chip,.fab,.catgrid button,.bnav button,.morelist button,.pend,.swatch,.tab,.tx,.seg button,.syncb{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.3,.7,.4,1.5),box-shadow .2s,background-color .25s,color .25s}
.btn:active,.chip:active,.catgrid button:active,.morelist button:active,.pend:active,.swatch:active,.seg button:active,.syncb:active,.tab:active{transform:scale(.95)}
.bnav button:active{transform:scale(.88)}
.tx:active{transform:scale(.985)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 82%,#fff),var(--brand));border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.fab{background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 78%,#fff),var(--brand) 55%,color-mix(in srgb,var(--brand) 80%,#000));box-shadow:0 12px 28px color-mix(in srgb,var(--brand) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s cubic-bezier(.3,.7,.4,1.5),box-shadow .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.logo i{background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 75%,#fff),var(--brand));box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 35%,transparent)}
.bar>span{background:linear-gradient(90deg,var(--c,var(--brand)),color-mix(in srgb,var(--c,var(--brand)) 70%,#fff))}
.hero{background:radial-gradient(130% 150% at 100% 0%,color-mix(in srgb,var(--brand) 62%,#fff) 0%,var(--brand) 48%,color-mix(in srgb,var(--brand) 68%,#000) 100%)!important;color:var(--brand-ink);border:0!important;box-shadow:0 14px 34px color-mix(in srgb,var(--brand) 32%,transparent)!important}
.hero .muted,.hero .small,.hero .tiny{color:color-mix(in srgb,var(--brand-ink) 78%,transparent)!important}
.hero .link,.hero .pos,.hero .neg,.hero b{color:var(--brand-ink)!important}
.hero .split{border-top-color:color-mix(in srgb,var(--brand-ink) 30%,transparent)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
dialog[open]::backdrop{animation:fade .3s ease}
dialog::backdrop{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes fade{from{opacity:0}}
@media (max-width:760px){
  dialog[open]{animation:sheet .38s cubic-bezier(.2,.9,.25,1)}
  .mform::before{content:'';display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 2px;flex:none}
}
@keyframes sheet{from{transform:translateY(100%)}}
main.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
main.enter .bar>span,main.enter .stack span{animation:grow 1s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes grow{from{width:0}}
main.enter .chart .b{animation:up .8s cubic-bezier(.2,.8,.2,1) both .15s;transform-origin:bottom}
@keyframes up{from{transform:scaleY(0)}}
.toast{transform:translateX(-50%) translateY(14px) scale(.94);transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:600px){.swatches{grid-template-columns:repeat(8,1fr)}}
.swatch{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink)}

<script type="text/plain" id="gscode">/** Finanzas en pareja — sincronización con Google Sheets
 *  Pegar en Extensiones > Apps Script de tu hoja y publicar como Aplicación web.
 */
const DATA_SHEET = '_datos_app';

function doGet(e) { return out_(leer_()); }

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    const body = JSON.parse(e.postData.contents);
    guardar_(body.data);
    vistas_(body.data);
    return out_({ ok: true, at: new Date().toISOString() });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function leer_() {
  const sh = SpreadsheetApp.getActive().getSheetByName(DATA_SHEET);
  if (!sh || sh.getLastRow() === 0) return { empty: true };
  const txt = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(r => r[0]).join('');
  return txt ? JSON.parse(txt) : { empty: true };
}

function guardar_(d) {
  const ss = SpreadsheetApp.getActive();
  const sh = ss.getSheetByName(DATA_SHEET) || ss.insertSheet(DATA_SHEET);
  sh.clear();
  const s = JSON.stringify(d);
  const rows = [];
  for (let i = 0; i < s.length; i += 45000) rows.push([s.slice(i, i + 45000)]);
  const rg = sh.getRange(1, 1, rows.length, 1);
  rg.setNumberFormat('@');
  rg.setValues(rows);
  if (!sh.isSheetHidden()) sh.hideSheet();
}

function tabla_(nombre, headers, rows) {
  const ss = SpreadsheetApp.getActive();
  const sh = ss.getSheetByName(nombre) || ss.insertSheet(nombre);
  sh.clear();
  const all = [headers].concat(rows);
  sh.getRange(1, 1, all.length, headers.length).setValues(all);
  sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#1f6f5c').setFontColor('#ffffff');
  sh.setFrozenRows(1);
}

function vistas_(d) {
  const cat = {}, acc = {}, goal = {}, debt = {};
  (d.categories || []).forEach(c => cat[c.id] = c.name);
  (d.accounts || []).forEach(a => acc[a.id] = a.name);
  (d.goals || []).forEach(g => goal[g.id] = g.name);
  (d.debts || []).forEach(x => debt[x.id] = x.name);
  const tx = (d.transactions || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  tabla_('Movimientos', ['Fecha', 'Tipo', 'Monto', 'Categoría', 'Cuenta', 'Persona', 'Detalle', 'Meta / Deuda'],
    tx.map(t => [t.date, t.type, Number(t.amount || 0), cat[t.categoryId] || '', acc[t.accountId] || '', t.person || '', t.note || '', goal[t.goalId] || debt[t.debtId] || '']));
  tabla_('Pagos fijos', ['Nombre', 'Valor', 'Cada (meses)', 'Próximo cobro', 'Categoría', 'Persona', 'Activo'],
    (d.subscriptions || []).map(s => [s.name, Number(s.amount || 0), s.freq || 1, s.nextDue || '', cat[s.categoryId] || '', s.person || '', s.active === false ? 'No' : 'Sí']));
  const drows = [];
  (d.debts || []).forEach(x => (x.items || []).forEach(i => drows.push([x.name, i.name, i.rate, Number(i.balance || 0), i.remaining, i.total])));
  tabla_('Deudas', ['Deuda', 'Concepto', 'Tasa E.A. %', 'Saldo capital', 'Cuotas restantes', 'Cuotas totales'], drows);
  tabla_('Metas', ['Meta', 'Objetivo', 'Ahorrado', 'Fecha límite'],
    (d.goals || []).map(g => [g.name, Number(g.target || 0), tx.filter(t => t.type === 'ahorro' && t.goalId === g.id).reduce((s, t) => s + Number(t.amount || 0), 0), g.deadline || '']));
  tabla_('Presupuestos', ['Categoría', 'Presupuesto mensual'],
    (d.categories || []).filter(c => c.kind !== 'ingreso').map(c => [c.name, Number(c.budget || 0)]));
}
</script>

function daysUntil(s){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)}
function nextDayOfMonth(day){const n=new Date();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()>day)m++;const dt=new Date(y,m,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(Math.min(day,last))}`}
function lastOcc(day){const n=new Date();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()<day)m--;const dt=new Date(y,m,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return new Date(dt.getFullYear(),dt.getMonth(),Math.min(day,last))}

function toast(msg){buzz([10,40,16]);const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ===================== estado ===================== */
function load(){
  try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);const def=defaultState();for(const k of Object.keys(def))if(d[k]===undefined)d[k]=def[k];d.settings={...def.settings,...d.settings};const tc=(d.debts||[]).find(x=>x.id==='tc-bbva');if(tc&&tc.last4==null)tc.last4='3434';return d}}catch(e){}
  return defaultState();
}
let state=load();
const ui={tab:'inicio',month:curMonth(),f:{type:'',person:'',cat:'',q:''}};
function persist(sync=true){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} if(sync)scheduleSync()}
function commit(){persist();render()}
const touch=o=>{o.updatedAt=now();return o};
function remove(coll,id){state[coll]=state[coll].filter(x=>x.id!==id);state.deleted[id]=now()}

const catById=id=>state.categories.find(c=>c.id===id);
const accById=id=>state.accounts.find(a=>a.id===id);
const goalById=id=>state.goals.find(g=>g.id===id);
const debtById=id=>state.debts.find(d=>d.id===id);
const subById=id=>state.subscriptions.find(s=>s.id===id);
const txById=id=>state.transactions.find(t=>t.id===id);
const txOfMonth=m=>state.transactions.filter(t=>t.date&&t.date.startsWith(m));

function accountBalance(id){
  const a=accById(id);let b=a?(+a.initial||0):0;
  for(const t of state.transactions){
    const v=+t.amount||0;
    if(t.accountId===id){ if(t.type==='ingreso') b+=v; else b-=v; } // gasto, deuda, transferencia, ahorro (retiro de meta es negativo → suma)
    if(t.type==='transferencia'&&t.toAccountId===id) b+=v;
  }
  return b;
}
const goalSaved=id=>state.transactions.filter(t=>t.type==='ahorro'&&t.goalId===id).reduce((s,t)=>s+(+t.amount||0),0);
const subsMonthly=()=>state.subscriptions.filter(s=>s.active!==false).reduce((a,s)=>a+(+s.amount||0)/(+s.freq||1),0);

/* ===================== cálculos de deuda ===================== */
function itemPayment(it){
  if(!it||it.balance<=0.5||it.remaining<=0) return {interest:0,capital:0,pay:0};
  const r=monthlyRate(it.rate), interest=it.balance*r;
  let pay;
  if(it.fixed>0) pay=it.fixed;
  else if(r===0) pay=it.balance/it.remaining;
  else pay=it.balance*r/(1-Math.pow(1+r,-it.remaining));
  let capital=Math.max(0,Math.min(it.balance,pay-interest));
  if(it.remaining<=1) capital=it.balance;
  return {interest,capital,pay:interest+capital};
}
function debtNext(d){
  let interest=0,capital=0;
  d.items.forEach(it=>{const p=itemPayment(it);interest+=p.interest;capital+=p.capital});
  const insurance=(capital+interest)>0?(+d.insurance||0):0;
  return {interest,capital,insurance,total:interest+capital+insurance};
}
const debtCapital=d=>d.items.reduce((s,i)=>s+Math.max(0,+i.balance||0),0);
function accrued(d){
  if(!d.cutDay) return 0;
  const c=lastOcc(+d.cutDay), n=new Date(); n.setHours(0,0,0,0);
  const days=Math.max(0,Math.round((n-c)/86400000));
  return debtNext(d).interest*Math.min(days,31)/30;
}
function termFor(S,r,P){
  if(P<=0) return 0;
  if(r===0) return Math.ceil(S/P-1e-9);
  const x=1-S*r/P; if(x<=0) return 999;
  return Math.ceil(-Math.log(x)/Math.log(1+r)-1e-9);
}
function applyDebtPayment(d,amount,extraId,keepCuota){
  let left=amount;
  const plans=d.items.map(it=>({it,p:itemPayment(it)}));
  const nx=debtNext(d);
  const insurance=Math.min(left,nx.insurance); left-=insurance;
  let interest=0,capital=0;
  plans.forEach(({p})=>{const x=Math.min(left,p.interest);left-=x;interest+=x});
  plans.forEach(({it,p})=>{
    if(p.capital<=0) return;
    const x=Math.min(left,p.capital);left-=x;it.balance-=x;capital+=x;
    if(x>=p.capital-1) it.remaining=Math.max(0,it.remaining-1);
  });
  if(left>0.5){
    let order=d.items.filter(i=>i.balance>0.5).sort((a,b)=>b.rate-a.rate);
    if(extraId){const t=d.items.find(i=>i.id===extraId);if(t&&t.balance>0.5)order=[t,...order.filter(i=>i!==t)]}
    for(const it of order){
      if(left<=0.5) break;
      const nextP=itemPayment(it).pay; // la cuota que tendría el próximo mes
      const x=Math.min(left,it.balance);it.balance-=x;left-=x;capital+=x;
      if(it.balance<=0.5){it.balance=0;it.remaining=0;continue}
      const r=monthlyRate(it.rate);
      if(keepCuota){ it.remaining=Math.max(1,termFor(it.balance,r,it.fixed>0?it.fixed:nextP)); }
      else if(it.fixed>0){ it.fixed=r===0?it.balance/it.remaining:it.balance*r/(1-Math.pow(1+r,-it.remaining)); }
    }
  }
  d.items.forEach(i=>{if(i.balance<0.5){i.balance=0;i.remaining=0}});
  return {interest,capital,insurance,surplus:left};
}
function simulate(d,extra,rollover){
  const items=d.items.filter(i=>i.balance>0.5&&i.remaining>0).map(i=>({rate:+i.rate,r:monthlyRate(i.rate),bal:+i.balance,P:itemPayment(i).pay}));
  const base=items.reduce((s,i)=>s+i.P,0)+extra;
  let months=0,interest=0,ins=0;
  while(items.some(i=>i.bal>0.5)&&months<600){
    months++;
    let budget=rollover?base:items.filter(i=>i.bal>0.5).reduce((s,i)=>s+i.P,0)+extra;
    ins+=+d.insurance||0;
    for(const i of items){
      if(i.bal<=0.5) continue;
      const int=i.bal*i.r; interest+=int;
      const pay=Math.min(i.P,i.bal+int); i.bal=i.bal+int-pay; budget-=pay;
    }
    for(const i of items.filter(i=>i.bal>0.5).sort((a,b)=>b.rate-a.rate)){
      if(budget<=0.5) break; const x=Math.min(budget,i.bal); i.bal-=x; budget-=x;
    }
  }
  return {months,interest,ins};
}

function budgetRows(m,limit){

function upcoming(days){
  const out=[];
  state.subscriptions.forEach(s=>{
    if(s.active===false||!s.nextDue) return;
    const dd=daysUntil(s.nextDue); if(dd<=days) out.push({date:s.nextDue,dd,name:s.name,amount:+s.amount,kind:'sub',id:s.id});
  });
  state.debts.forEach(d=>{
    if(!d.dueDay||debtCapital(d)<1) return;
    const date=nextDayOfMonth(+d.dueDay), dd=daysUntil(date);
    const paid=state.transactions.some(t=>t.type==='deuda'&&t.debtId===d.id&&daysUntil(t.date)<=0&&daysUntil(t.date)>=dd-24);
    if(!paid&&dd<=days) out.push({date,dd,name:d.name,amount:debtNext(d).total,kind:'debt',id:d.id});
  });
  return out.sort((a,b)=>a.dd-b.dd);
}
function duePill(dd){
  if(dd<0) return `<span class="pill danger">Vencido hace ${-dd} d</span>`;
  if(dd===0) return `<span class="pill danger">Hoy</span>`;
  if(dd<=3) return `<span class="pill warn">En ${dd} d</span>`;
  return `<span class="pill">En ${dd} días</span>`;
}
function upcomingList(){
  const list=upcoming(20);
  const noDate=state.subscriptions.filter(s=>s.active!==false&&!s.nextDue).length;
  let h=list.length?`<div class="txl">${list.map(u=>`<button class="tx" data-act="${u.kind==='sub'?'paySub':'payDebt'}" data-id="${u.id}"><span class="ti">${u.kind==='sub'?'📅':'💳'}</span><span class="tm"><b>${esc(u.name)}</b><small>${fmtDate(u.date)} · toca para registrar el pago</small></span><span style="text-align:right"><span class="ta">${fmt(u.amount)}</span><br>${duePill(u.dd)}</span></button>`).join('')}</div>`:empty('Nada por pagar en los próximos 20 días.');

}

function txRow(t){

  else if(t.type==='ingreso'){icon=c?.icon||'💰';title=t.note||c?.name||'Ingreso';sign='+';cls='pos'}
  else if(t.type==='transferencia'){icon='🔁';title=t.note||'Transferencia';sub.push('→ '+(accById(t.toAccountId)?.name||''));sign=''}
  else if(t.type==='ahorro'){const g=goalById(t.goalId);icon='🎯';title=(t.amount<0?'Retiro de ':'Ahorro para ')+(g?.name||'meta');sign=t.amount<0?'+':'-';cls='brand'}

function debtCard(d){
  const cap=debtCapital(d), orig=+d.original||cap, paid=Math.max(0,orig-cap), pct=orig?paid/orig*100:0;
  const nx=debtNext(d), T=nx.total||1;
  const ip=nx.interest/T*100, cp=nx.capital/T*100, sp=nx.insurance/T*100;
  const acc=accrued(d);
  const due=d.dueDay&&cap>0?nextDayOfMonth(+d.dueDay):'';
  const hist=(d.history||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const pts=[{label:'Inicio',v:orig,start:true},...hist.map(h=>({label:monthShort(h.date),v:h.after}))].slice(-8);
  const maxV=Math.max(...pts.map(p=>p.v),1);
  const withInt=hist.filter(h=>h.interest!=null&&h.amount).slice(-3);
  let insight='';
  if(withInt.length){
    const A=withInt.reduce((s,h)=>s+h.amount,0), I=withInt.reduce((s,h)=>s+h.interest,0), S=withInt.reduce((s,h)=>s+(h.insurance||0),0);
    insight=`<div class="insight int">En los últimos ${withInt.length} pagos pusieron <b>${fmt(A)}</b>: <b>${fmt(I)}</b> (${pctf(I/A*100)}) se fueron en intereses${S?` y ${fmt(S)} en seguro`:''}, y <b>${fmt(A-I-S)}</b> sí bajaron la deuda. Por eso el saldo baja más lento de lo que pagan.</div>`;
  }
  const rows=d.items.filter(i=>i.balance>0.5||i.remaining>0).map(i=>{const p=itemPayment(i);return `<tr><td>${esc(i.name)}</td><td class="n">${(+i.rate).toLocaleString('es-CO')}%</td><td class="n">${fmt(i.balance)}</td><td class="n">${i.remaining} de ${i.total}</td><td class="n">${fmt(p.capital)}</td><td class="n">${fmt(p.interest)}</td></tr>`}).join('');
  const done=d.items.filter(i=>i.balance<=0.5&&i.remaining<=0).map(i=>esc(i.name));
  let prev=null;
  const histRows=hist.map(h=>{const capPaid=prev!=null?prev-h.after:null;prev=h.after;if(!h.amount)return '';return `<tr><td>${fmtDate(h.date)}</td><td class="n">${fmt(h.amount)}</td><td class="n">${h.interest!=null?fmt(h.interest):'—'}</td><td class="n">${capPaid!=null?fmt(capPaid):'—'}</td><td class="n">${fmt(h.after)}</td></tr>`}).reverse().join('');
  const extraTarget=d.items.filter(i=>i.balance>0.5).sort((a,b)=>b.rate-a.rate)[0];
  return `<div class="card" id="debt-${d.id}">
    <div class="ch" style="align-items:flex-start">
      <div><h3 style="font-size:17px">${d.kind==='tarjeta'?'💳':'🏦'} ${esc(d.name)}</h3><div class="tiny muted">${esc(d.bank||'')}${d.note?' · '+esc(d.note):''}</div></div>
      <div class="actions" style="margin:0"><button class="btn sm" data-act="editDebt" data-id="${d.id}">Editar / extracto</button><button class="btn sm primary" data-act="payDebt" data-id="${d.id}">Registrar pago</button></div>
    </div>
    <div class="grid three" style="margin-bottom:6px">
      <div><div class="tiny muted">Capital pendiente</div><div class="big" style="font-size:26px">${fmt(cap)}</div>${acc>1?`<div class="tiny muted">Hoy en la app del banco verán ≈ <b>${fmt(cap+acc)}</b> (capital + intereses que van corriendo desde el corte)</div>`:''}</div>
      <div><div class="tiny muted">Ya pagaron</div><div class="big brand" style="font-size:26px">${pctf(pct)}</div><div class="tiny muted">${fmt(paid)} de ${fmt(orig)} financiados</div></div>
      <div><div class="tiny muted">Próxima cuota estimada</div><div class="big" style="font-size:26px">${fmt(nx.total)}</div><div class="tiny muted">${due?`Vence ≈ ${fmtDate(due)} · `:''}el extracto puede variar unos pesos</div></div>
    </div>
    <div class="bar lg"><span style="width:${pct}%"></span></div>
    <div class="ch" style="margin:14px 0 0"><h3>¿A dónde va la próxima cuota?</h3></div>
    <div class="stack"><span class="s-cap" style="width:${cp}%"></span><span class="s-int" style="width:${ip}%"></span><span class="s-ins" style="width:${sp}%"></span></div>
    <div class="legend"><span><i class="s-cap"></i>Baja la deuda ${fmt(nx.capital)} (${pctf(cp)})</span><span><i class="s-int"></i>Intereses ${fmt(nx.interest)} (${pctf(ip)})</span>${nx.insurance?`<span><i class="s-ins"></i>Seguro ${fmt(nx.insurance)}</span>`:''}</div>
    ${insight}
    <div class="ch" style="margin:14px 0 0"><h3>Capital pendiente después de cada pago</h3></div>
    <div class="chart">${pts.map(p=>`<div class="col"><span class="cv">${(p.v/1e6).toLocaleString('es-CO',{maximumFractionDigits:2})}M</span><div class="b ${p.start?'start':''}" style="height:${Math.max(4,p.v/maxV*100)}%"></div><span class="cl">${p.label}</span></div>`).join('')}</div>
    <div class="ch" style="margin:16px 0 6px"><h3>Detalle por concepto</h3></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Concepto</th><th class="n">Tasa E.A.</th><th class="n">Saldo</th><th class="n">Cuotas rest.</th><th class="n">Capital próx.</th><th class="n">Interés próx.</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Sin saldo 🎉</td></tr>'}</tbody></table></div>
    ${done.length?`<p class="tiny muted">Terminados: ${done.join(', ')} ✓</p>`:''}
    ${cap>1?`<div class="sim">
      <h3>Simular abonos extra</h3>
      <p class="tiny muted" style="margin:4px 0 0">El extra se abona a capital del concepto con la tasa más alta${extraTarget?` (hoy: ${esc(extraTarget.name)}, ${extraTarget.rate}%)`:''}, y cuando algo se termina, esa plata se sigue usando para lo demás.</p>
      <div class="chips">${[0,50000,100000,200000,300000,500000].map(v=>`<button class="chip" data-simset="${d.id}" data-v="${v}">${v?'+'+fmt(v):'Solo la cuota'}</button>`).join('')}</div>
      <label class="small muted">Extra al mes <input data-sim="${d.id}" inputmode="decimal" value="100.000"></label>
      <div id="simres-${d.id}">${simHtml(d,100000)}</div>
    </div>`:''}
    ${histRows?`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:600">Historial de pagos</summary><div class="scroll"><table class="tbl" style="margin-top:8px"><thead><tr><th>Fecha</th><th class="n">Pagado</th><th class="n">Intereses</th><th class="n">Bajó capital</th><th class="n">Quedó</th></tr></thead><tbody>${histRows}</tbody></table></div></details>`:''}
  </div>`;
}
function simHtml(d,extra){
  const b=simulate(d,0,false), p=simulate(d,extra,true);
  const end=n=>monthLabel(addMonths(todayStr(),n));
  const saveI=b.interest+b.ins-(p.interest+p.ins), saveM=b.months-p.months;
  return `<div class="simres">
    <div><span class="tiny muted">Pagando solo la cuota</span><b>${b.months} meses</b><span class="tiny">Terminan en ${end(b.months)} · intereses ${fmt(b.interest)}</span></div>
    <div><span class="tiny muted">${extra?`Con ${fmt(extra)} extra al mes`:'Manteniendo la cuota de hoy'}</span><b class="brand">${p.months} meses</b><span class="tiny">Terminan en ${end(p.months)} · intereses ${fmt(p.interest)}</span></div>
  </div>
  ${saveI>1?`<p class="small" style="margin:10px 0 0">Se ahorran <b class="pos">${fmt(saveI)}</b> en intereses y seguro, y terminan <b>${saveM} ${saveM===1?'mes':'meses'}</b> antes.</p>`:''}`;
}

function modal(html,onSubmit,opts={}){
  dlg.innerHTML=`<form class="mform">${html}<div class="mactions">${opts.del?'<button type="button" class="btn danger del" data-del>Eliminar</button>':''}<button type="button" class="btn" data-close>${opts.noSubmit?'Cerrar':'Cancelar'}</button>${opts.noSubmit?'':`<button class="btn primary">${opts.submit||'Guardar'}</button>`}</div></form>`;
  const f=dlg.querySelector('form');
  f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit(f)!==false){dlg.close();commit()}});
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  if(opts.del) dlg.querySelector('[data-del]').onclick=()=>{if(confirm(opts.delMsg||'¿Eliminar?')){opts.del();dlg.close();commit()}};
  f.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));f.elements[seg.dataset.seg].value=b.dataset.v;syncShow(f);opts.onSeg&&opts.onSeg(f)}));
  syncShow(f);opts.onOpen&&opts.onOpen(f);
  dlg.showModal();
  const first=f.querySelector('[autofocus]'); if(first) setTimeout(()=>first.focus(),50);
}
function syncShow(f){const t=f.elements.type?.value;f.querySelectorAll('[data-show]').forEach(el=>el.style.display=el.dataset.show.split(' ').includes(t)?'':'none')}

function openTx(tx,preset={}){
  const isNew=!tx;
  if(tx&&(tx.type==='deuda'||tx.type==='ahorro')) return openSpecialTx(tx);
  tx=tx||{type:'gasto',date:todayStr(),amount:'',categoryId:'comida',accountId:defSource(),toAccountId:state.accounts[1]?.id,person:me(),note:'',...preset};
  modal(`<h3>${isNew?'Nuevo movimiento':'Editar movimiento'}</h3>
    <input type="hidden" name="type" value="${tx.type}">
    <div class="seg" data-seg="type">${['gasto','ingreso','transferencia'].map(t=>`<button type="button" class="${tx.type===t?'on':''}" data-v="${t}">${LBL[t]}</button>`).join('')}</div>
    <label>Valor<input name="amount" inputmode="decimal" value="${tx.amount?fmtPlain(tx.amount):''}" placeholder="0" required autofocus></label>
    <label>Detalle<input name="note" value="${esc(tx.note)}" placeholder="Ej: mercado D1, Uber, arena gatos…"></label>
    <div class="grid2">
      <label data-show="gasto">Categoría${catSel(tx.categoryId,'gasto')}</label>
      <label data-show="ingreso">Categoría<select name="categoryIdIn">${state.categories.filter(c=>c.kind==='ingreso').map(c=>opt(c.id,c.icon+' '+c.name,tx.categoryId)).join('')}</select></label>
      <label data-show="transferencia">Hacia la cuenta${accSel('toAccountId',tx.toAccountId)}</label>
      <label>Fecha<input type="date" name="date" value="${tx.date}"></label>
    </div>
    <div class="grid2">
      <label><span data-show="gasto">Pagado con</span><span data-show="transferencia">Desde la cuenta</span><span data-show="ingreso">A la cuenta</span><select name="accountId">${payOptions(tx.cardDebtId?'card:'+tx.cardDebtId:tx.accountId)}</select></label>
      <label>¿Quién?${personSel(tx.person)}</label>
    </div>`,
  f=>{
    const amount=parseMoney(val(f,'amount')); if(amount<=0){alert('Escribe un valor');return false}
    const type=val(f,'type');
    const src=val(f,'accountId'), cardId=src.startsWith('card:')?src.slice(5):'';
    if(cardId&&type!=='gasto'){alert('La tarjeta de crédito solo sirve para registrar gastos');return false}
    const o=isNew?{id:uid(),createdAt:now()}:tx;
    if(!isNew&&tx.cardDebtId) cardAdjust(tx.cardDebtId,-tx.amount);
    if(cardId) cardAdjust(cardId,amount);
    o.cardDebtId=cardId;
    Object.assign(o,{type,amount,note:val(f,'note').trim(),date:val(f,'date')||todayStr(),accountId:cardId?'':src,person:val(f,'person'),
      categoryId:type==='gasto'?val(f,'categoryId'):type==='ingreso'?val(f,'categoryIdIn'):'',
      toAccountId:type==='transferencia'?val(f,'toAccountId'):''});
    if(type==='transferencia'&&o.toAccountId===o.accountId){alert('Elige dos cuentas distintas');return false}
    touch(o); if(isNew) state.transactions.push(o);
    toast(isNew?'Movimiento guardado':'Cambios guardados');
  },{del:isNew?null:()=>{if(tx.cardDebtId)cardAdjust(tx.cardDebtId,-tx.amount);remove('transactions',tx.id)},delMsg:'¿Eliminar este movimiento?'});
}
function openSpecialTx(tx){
  const d=tx.type==='deuda'?debtById(tx.debtId):null;
  const canRevert=d&&tx.snapshot&&(d.history||[]).slice(-1)[0]?.id===tx.id;
  modal(`<h3>${tx.type==='deuda'?'Pago de deuda':'Movimiento de meta'}</h3>
    <p class="small muted">${fmt(Math.abs(tx.amount))} · ${fmtDateLong(tx.date)}${tx.split?`<br>Intereses ${fmt(tx.split.interest)} · capital ${fmt(tx.split.capital)}${tx.split.insurance?` · seguro ${fmt(tx.split.insurance)}`:''}`:''}</p>
    <label>Detalle<input name="note" value="${esc(tx.note||'')}"></label>
    ${tx.type==='deuda'?`<p class="tiny muted">${canRevert?'Si lo eliminas, el saldo de la deuda vuelve a como estaba antes del pago.':'Si lo eliminas, el saldo de la deuda no cambia; corrígelo en “Editar / extracto”.'}</p>`:''}`,
  f=>{tx.note=val(f,'note');touch(tx)},
  {del:()=>{
    if(canRevert){d.items=tx.snapshot;d.history.pop();touch(d)}
    remove('transactions',tx.id);
  },delMsg:'¿Eliminar este movimiento?'});
}

function openPayDebt(id){
  const d=debtById(id), nx=debtNext(d);
  const live=d.items.filter(i=>i.balance>0.5).sort((a,b)=>b.rate-a.rate);
  modal(`<h3>Registrar pago</h3>
    <p class="small muted" style="margin:0">${esc(d.name)}<br>Cuota estimada <b>${fmt(nx.total)}</b>: capital ${fmt(nx.capital)} · intereses ${fmt(nx.interest)}${nx.insurance?` · seguro ${fmt(nx.insurance)}`:''}. Si el extracto dice otro valor, escriban el real.</p>
    <label>Valor pagado<input name="amount" inputmode="decimal" value="${fmtPlain(Math.round(nx.total*100)/100)}" autofocus></label>

    <label>¿Quién pagó?${personSel(me())}</label>
    <label>Si pagan más de la cuota, el extra va a<select name="extra">${live.map(i=>opt(i.id,`${i.name} (${i.rate}%)`,live[0]?.id)).join('')}</select></label>
    <label class="check"><input type="checkbox" name="plazo" checked> Con el extra, reducir el plazo (recomendado)</label>`,
  f=>{
    const amount=parseMoney(val(f,'amount')); if(amount<=0){alert('Escribe un valor');return false}
    const snapshot=JSON.parse(JSON.stringify(d.items));
    const res=applyDebtPayment(d,amount,val(f,'extra'),f.elements.plazo.checked);
    const id=uid(), date=val(f,'date')||todayStr();
    d.history=d.history||[];
    d.history.push({id,date,amount,interest:res.interest,insurance:res.insurance,after:debtCapital(d)});
    touch(d);
    state.transactions.push(touch({id,type:'deuda',date,amount,accountId:val(f,'accountId'),person:val(f,'person'),debtId:d.id,note:'Pago '+d.name,split:res,snapshot}));

  },{submit:'Registrar pago'});
}

function cardAdjust(debtId,delta){
  const d=debtById(debtId); if(!d) return;
  let it=d.items.find(i=>i.id===d.id+'-nuevas');
  if(!it){it={id:d.id+'-nuevas',name:'Compras nuevas (1 cuota)',rate:0,balance:0,remaining:0,total:1,fixed:0};d.items.push(it)}
  it.balance=Math.max(0,(+it.balance||0)+delta); it.remaining=it.balance>0.5?1:0;

function parseAmountLoose(s){
  s=String(s).replace(/[.,]+$/,'');
  const ld=s.lastIndexOf('.'), lc=s.lastIndexOf(',');
  if(ld>=0&&lc>=0){const dec=ld>lc?'.':',',th=dec==='.'?',':'.';s=s.split(th).join('').replace(dec,'.')}
  else{const sep=ld>=0?'.':lc>=0?',':'';if(sep){const parts=s.split(sep);s=(parts.length===2&&parts[1].length<=2)?parts[0]+'.'+parts[1]:parts.join('')}}

}
function parseNotif(title,text){
  title=(title||'').trim(); text=(text||'').trim();
  const all=title+' '+text;
  const m=all.match(/(?:COP|\$)\s?(\d[\d.,]*)/i)||all.match(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/);
  const amount=m?parseAmountLoose(m[1]):0;
  let merchant=title;
  if(!merchant||/google|wallet|^pago|^compra/i.test(merchant)){
    const mm=text.match(/\ben\s+(.+?)(?:\s+con\b|\s+por\b|\s+el\b|[,.$]|$)/i);
    merchant=mm?mm[1].trim():(merchant||'');
  }
  if(/\d[\d.,]{3,}/.test(merchant)&&!/[a-z]{3}/i.test(merchant)) merchant='';
  const l4=all.match(/(?:[•*·xX]+|terminada en|termina en|final)\s*(\d{4})\b/i);
  return {amount,merchant,last4:l4?l4[1]:''};
}

    if(el.children.length) return;

    const v=+txt.replace(/[^\d]/g,''); if(!v) return;
    const sg=txt.includes('-')?-1:1, t0=performance.now(), D=750;
    const step=t=>{const p=Math.min(1,(t-t0)/D);el.textContent=p<1?fmt(sg*v*(1-Math.pow(1-p,3))):txt;if(p<1)requestAnimationFrame(step)};

function confetti(){

  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;

  const cols=[cs.getPropertyValue('--brand'),cs.getPropertyValue('--int'),cs.getPropertyValue('--ok'),'#f590bc','#f1c65c','#6fabf2'].map(s=>s.trim());
  const ps=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*60,y:H*.62,vx:(Math.random()-.5)*13,vy:-Math.random()*15-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){const el=t-t0;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-el/1800);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));ctx.restore()});
    if(el<1800)requestAnimationFrame(f);else cv.remove()})(t0);

/* ===================== sincronización con Google Sheets ===================== */
const COLLS=['categories','accounts','transactions','subscriptions','debts','goals','rules','pending'];
let syncState={status:'idle',timer:null,busy:false,again:false};
function merge(local,remote){
  const out={...local};
  const del={...(remote.deleted||{})};
  for(const [k,v] of Object.entries(local.deleted||{})) del[k]=Math.max(del[k]||0,v);
  out.deleted=del;
  for(const c of COLLS){
    const map=new Map();
    (local[c]||[]).forEach(x=>map.set(x.id,x));
    (remote[c]||[]).forEach(x=>{const l=map.get(x.id);if(!l||(x.updatedAt||0)>(l.updatedAt||0))map.set(x.id,x)});
    out[c]=[...map.values()].filter(x=>!(del[x.id]>=(x.updatedAt||0)));
  }
  if((remote.peopleUpdatedAt||0)>(local.peopleUpdatedAt||0)){out.people=remote.people;out.peopleUpdatedAt=remote.peopleUpdatedAt}
  out.settings=local.settings;
  return out;
}
function syncBadge(){
  const b=$('#syncb'),t=$('#synct'),s=state.settings;
  b.className='syncb';
  if(!s.sheetsUrl){t.textContent='Sin sincronizar';return}
  if(syncState.status==='busy'){b.classList.add('busy');t.textContent='Sincronizando…'}
  else if(syncState.status==='err'){b.classList.add('err');t.textContent='Error al sincronizar'}
  else{b.classList.add('ok');t.textContent=s.lastSync?'Sincronizado '+new Date(s.lastSync).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):'Sheets conectado'}
}
function scheduleSync(){
  if(!state.settings.sheetsUrl||state.settings.autoSync===false) return;
  clearTimeout(syncState.timer); syncState.timer=setTimeout(syncNow,3000);
}
async function syncNow(){
  const url=state.settings.sheetsUrl; if(!url) return;
  if(syncState.busy){syncState.again=true;return}
  syncState.busy=true;syncState.status='busy';syncBadge();
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now());
    const remote=await r.json();
    if(remote&&!remote.empty&&remote.version) state=merge(state,remote);
    const payload={...state};delete payload.settings;
    const res=await fetch(url,{method:'POST',body:JSON.stringify({data:payload})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'sin respuesta');
    state.settings.lastSync=Date.now();syncState.status='ok';
    persist(false);
    if(!dlg.open&&document.activeElement?.tagName!=='INPUT') render(); else syncBadge();
  }catch(err){console.warn('sync',err);syncState.status='err';syncBadge();toast('No se pudo sincronizar. Revisen la URL o la conexión.')}
  finally{syncState.busy=false;if(syncState.again){syncState.again=false;scheduleSync()}}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.settings.sheetsUrl)syncNow()});
